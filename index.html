<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разбор — учить язык по видео</title>
<!-- Фавикон — тот же знак, что .brand-mark: коралловый квадрат с двумя строками субтитров -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23ff6b4a'/%3E%3Crect%20x='15'%20y='23'%20width='34'%20height='7'%20rx='3.5'%20fill='%23fff'/%3E%3Crect%20x='15'%20y='36'%20width='23'%20height='7'%20rx='3.5'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0e1317">
<style>
/* ============================================================
   Палитра. Тёмная тема — основная (инструмент для просмотра видео),
   светлая переопределяет токены. Акцент один на всё приложение: коралл.
   Семантика отдельно от акцента: зелёный = слово уже в колоде.
   ============================================================ */
:root {
  --ground:      #0e1317;
  --surface:     #161d23;
  --surface-2:   #1e272f;
  --line:        #2a353f;
  --text:        #e6edf2;
  --text-soft:   #9fb1c0;
  --text-mute:   #6b7f8f;
  --accent:      #ff6b4a;
  --accent-soft: #3a1f18;
  --known:       #4fa87a;
  --known-soft:  #14291f;
  --track-2:     #7f95a8;

  --radius: 10px;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-read: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground:      #f4f7f9;
    --surface:     #ffffff;
    --surface-2:   #eaeff3;
    --line:        #d6dfe6;
    --text:        #141c24;
    --text-soft:   #4c5c69;
    --text-mute:   #7a8b98;
    --accent:      #d9411f;
    --accent-soft: #fde8e2;
    --known:       #2e7d55;
    --known-soft:  #dff0e6;
    --track-2:     #64798a;
  }
}
:root[data-theme="light"] {
  --ground:      #f4f7f9;
  --surface:     #ffffff;
  --surface-2:   #eaeff3;
  --line:        #d6dfe6;
  --text:        #141c24;
  --text-soft:   #4c5c69;
  --text-mute:   #7a8b98;
  --accent:      #d9411f;
  --accent-soft: #fde8e2;
  --known:       #2e7d55;
  --known-soft:  #dff0e6;
  --track-2:     #64798a;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- Каркас ---------- */
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-rows: auto 1fr;
  height: 100dvh;
  max-width: 1500px;
  margin: 0 auto;
}
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0 1.25rem;
  height: 60px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand {
  font-weight: 640;
  letter-spacing: -0.02em;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 5px;
  background: var(--accent);
  display: grid;
  place-items: center;
  flex: none;
}
.brand-mark::after {
  content: "";
  width: 11px; height: 2px;
  background: var(--ground);
  box-shadow: 0 4px 0 var(--ground);
  border-radius: 1px;
}
.url-form { display: flex; gap: 0.5rem; flex: 1; max-width: 460px; }
.url-form input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius);
  padding: 0.5rem 0.75rem;
  font: inherit;
  min-width: 0;
}
.url-form input::placeholder { color: var(--text-mute); }
.url-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius);
  padding: 0.5rem 1rem;
  font-weight: 600;
  white-space: nowrap;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn-ghost {
  background: var(--surface-2);
  color: var(--text-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.8rem;
  font-weight: 500;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-mute); }
.btn-ghost[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ---------- Левая колонка ---------- */
.main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.stage { background: #000; flex: none; }
.player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 44vh; }
.player-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.controls {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1.25rem;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex: none;
  flex-wrap: wrap;
}
.tc {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-mute);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.legend { display: flex; gap: 0.9rem; align-items: center; font-size: 0.75rem; color: var(--text-mute); }
.legend i { font-style: normal; display: inline-flex; align-items: center; gap: 0.3rem; }
.legend i::before {
  content: ""; width: 10px; height: 3px; border-radius: 2px; background: var(--accent);
}
.legend i.known::before { background: var(--known); }

/* ---------- Расшифровка: главная поверхность чтения ---------- */
.transcript {
  overflow-y: auto;
  padding: 1.5rem 1.25rem 40vh;
  font-family: var(--font-read);
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  .transcript { scroll-behavior: auto; }
}
.cue {
  display: grid;
  grid-template-columns: 3.6rem minmax(0, 1fr);
  gap: 0 1rem;
  padding: 0.5rem 0.6rem;
  border-radius: var(--radius);
  align-items: start;
}
.cue + .cue { margin-top: 0.15rem; }
.cue-time {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-mute);
  padding-top: 0.42rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
  cursor: pointer;
}
.cue-time:hover { color: var(--accent); }
.cue-body { min-width: 0; }
.cue-orig { font-size: 1.22rem; line-height: 1.55; letter-spacing: -0.008em; }
.cue-tr {
  font-size: 0.92rem;
  color: var(--track-2);
  margin-top: 0.2rem;
  min-height: 1.1em;
}
/* Русская дорожка выключается целиком: остаются только английские субтитры,
   и место под перевод не резервируется — строки сходятся плотнее. */
.transcript[data-tr="off"] .cue-tr { display: none; }

/* Пока перевод дотекает, у непереведённых строк вместо пустоты — бледный пульс,
   иначе непонятно, сломалось оно или ещё считается. */
.cue-tr:empty::after {
  content: "";
  display: block;
  width: 42%;
  height: 0.55em;
  margin-top: 0.15em;
  border-radius: 3px;
  background: var(--surface-2);
  animation: trPulse 1.4s ease-in-out infinite;
}
.transcript[data-tr="idle"] .cue-tr:empty::after { display: none; }
@keyframes trPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
@media (prefers-reduced-motion: reduce) { .cue-tr:empty::after { animation: none; } }

.tr-status { font-size: 0.75rem; color: var(--text-mute); font-variant-numeric: tabular-nums; }

/* Фильтр по уровню: перевод остаётся только под репликами на/выше выбранного уровня.
   Простое пользователь понимает сам — перевод под каждой строкой мешает слушать. */
.cue.lvl-skip .cue-tr { display: none; }
select.btn-ghost { -webkit-appearance: none; appearance: none; cursor: pointer; }
.cue.active { background: var(--surface); }
.cue.active .cue-time { color: var(--accent); }

/* Слово — основной интерактивный примитив */
.w {
  cursor: pointer;
  border-radius: 3px;
  padding: 0 1px;
  transition: background-color .1s ease, color .1s ease;
}
.w:hover { background: var(--surface-2); }
.w.spoken { color: var(--text-soft); }
.w.now {
  background: var(--accent);
  color: #fff;
}
.w.known {
  box-shadow: inset 0 -2px 0 var(--known);
}
.w.now.known { box-shadow: inset 0 -2px 0 rgba(255,255,255,.55); }

/* ---------- Правая колонка ---------- */
.side {
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
/* Пять вкладок в колонке 340px. nowrap давал наезд подписей друг на друга,
   разрешённый перенос — разрыв «Повторени/е» посреди слова. Поэтому подписи
   короткие в один слог-два, шрифт мельче, и всё влезает без переносов. */
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tab {
  flex: 1 1 0;
  min-width: 0;
  padding: 0.8rem 0.15rem;
  font-size: 0.72rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
  font-weight: 560;
  color: var(--text-mute);
  border-bottom: 2px solid transparent;
  transition: color .12s ease;
}
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text-soft); }
.panel { overflow-y: auto; padding: 1.1rem; flex: 1; display: none; }
.panel[data-open="true"] { display: block; }

/* Карточка слова */
.lookup-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.lookup-word { font-size: 1.7rem; font-weight: 620; letter-spacing: -0.02em; font-family: var(--font-read); }
.lookup-tr { font-size: 1.05rem; color: var(--accent); margin-top: 0.35rem; }
.lookup-note { font-size: 0.86rem; color: var(--text-mute); margin-top: 0.3rem; line-height: 1.45; }
.lookup-miss { font-size: 0.88rem; color: var(--text-mute); margin-top: 0.35rem; line-height: 1.45; }
.context {
  margin-top: 1.1rem;
  padding: 0.85rem 0.95rem;
  background: var(--surface-2);
  border-radius: var(--radius);
  border-left: 2px solid var(--accent);
}
.context-label {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-mute);
  display: block;
  margin-bottom: 0.4rem;
}
.context-text { font-family: var(--font-read); font-size: 0.98rem; line-height: 1.5; }
.context-text b { color: var(--accent); font-weight: 620; }
/* Слова контекста кликабельны: так собирается словосочетание для разбора */
.ctx-w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.ctx-w:hover { background: var(--surface-2); }
.ctx-w.sel { color: var(--accent); font-weight: 620; }
.ctx-hint { display: block; font-size: 0.72rem; color: var(--text-mute); margin-top: 0.45rem; line-height: 1.4; }
.lookup-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }

/* Колода */
.deck-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.1rem;
}
.stat { background: var(--surface); padding: 0.7rem 0.6rem; text-align: center; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; font-weight: 620; }
.stat span { font-size: 0.68rem; color: var(--text-mute); }
.card-row {
  padding: 0.7rem 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 0.7rem;
  align-items: baseline;
}
.card-row:last-child { border-bottom: 0; }
.card-w { font-weight: 600; font-family: var(--font-read); }
.card-tr { color: var(--text-soft); font-size: 0.86rem; flex: 1; min-width: 0; }
.card-jump {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-mute);
  white-space: nowrap;
}
.card-jump:hover { color: var(--accent); }

/* Пустое состояние */
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-mute); }
.empty-title { color: var(--text-soft); font-weight: 560; margin-bottom: 0.4rem; }
.empty p { margin: 0; font-size: 0.88rem; line-height: 1.5; }

/* Повторение */
.review-card {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 1.5rem 1.2rem;
  text-align: center;
}
.review-word { font-size: 2rem; font-weight: 620; font-family: var(--font-read); letter-spacing: -0.02em; }
/* Вырезанный кусок видео с фразой — сердце карточки */
.review-clip { margin-top: 0.9rem; }
.review-clip video {
  width: 100%;
  max-height: 200px;
  border-radius: 8px;
  background: #000;
  display: block;
}
.clip-miss { font-size: 0.8rem; color: var(--text-mute); padding: 0.6rem 0; }

/* Клоз: фраза с пропуском на месте слова — вспоминаем в контексте, не изолированно */
.review-cloze {
  font-size: 1.15rem;
  line-height: 1.6;
  font-family: var(--font-read);
  margin-bottom: 0.3rem;
}
.review-cloze .cloze {
  border-bottom: 2px solid var(--accent);
  color: var(--accent);
  font-weight: 620;
}
.review-word.small { font-size: 1.35rem; margin-top: 0.5rem; }

/* Диктант */
.dict-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; margin-bottom: 0.6rem; font-size: 0.8rem; color: var(--text-mute);
}
.dict-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-family: var(--font-read);
  padding: 0.7rem 0.8rem;
  resize: vertical;
}
.dict-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.dict-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
.dict-actions .btn { flex: 1; }
.dict-result:not(:empty) { margin-top: 0.8rem; }
.dict-score { font-size: 1.4rem; font-weight: 640; color: var(--accent); }
.dict-score[data-good="true"] { color: var(--known); }
.dict-diff {
  margin-top: 0.5rem; line-height: 1.9;
  font-family: var(--font-read); font-size: 1.02rem;
}
/* Цвет здесь семантический, не акцентный: угадано / не то / пропущено / лишнее */
.d-ok { color: var(--known); }
.d-wrong { color: var(--accent); text-decoration: underline; }
.d-got { color: var(--text-mute); font-size: 0.82em; }
.d-got::before { content: "→"; margin: 0 0.15em; }
.d-miss { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 3px; }
.d-extra { color: var(--text-mute); text-decoration: line-through; }
.dict-hint { font-size: 0.78rem; color: var(--text-mute); line-height: 1.5; margin-top: 0.9rem; }

/* Прогресс */
.chart-title { font-size: 0.78rem; color: var(--text-mute); margin: 1.1rem 0 0.5rem; }
.chart {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 3px; align-items: end; height: 88px;
}
.bar-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar-col span { font-size: 0.62rem; color: var(--text-mute); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Библиотека видео */
.lib-row {
  display: flex; flex-direction: column; gap: 1px;
  padding: 0.5rem 0; border-top: 1px solid var(--line);
}
.lib-open { text-align: left; font-size: 0.88rem; color: var(--text); line-height: 1.35; }
.lib-open:hover { color: var(--accent); }
.lib-meta { font-size: 0.72rem; color: var(--text-mute); }
.review-ctx { margin-top: 1rem; font-size: 0.92rem; color: var(--text-soft); line-height: 1.5; font-family: var(--font-read); }
.review-ctx b { color: var(--accent); }
.review-answer { margin-top: 1rem; font-size: 1.15rem; color: var(--accent); }
.grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 1rem; }
.grade { padding: 0.55rem 0.2rem; border: 1px solid var(--line); border-radius: 8px; font-size: 0.76rem; background: var(--surface); }
.grade:hover { border-color: var(--accent); color: var(--accent); }

.toast {
  position: fixed;
  bottom: 1.5rem; left: 50%;
  transform: translateX(-50%) translateY(1rem);
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
  font-size: 0.86rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 40;
}
.toast[data-show="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Мобильная раскладка ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100dvh; }
  .player-box { max-height: none; }
  .side {
    border-left: 0;
    border-top: 1px solid var(--line);
    position: sticky;
    bottom: 0;
    max-height: 52dvh;
  }
  .transcript { padding-bottom: 2rem; }
  .url-form { max-width: none; }
  .topbar { flex-wrap: wrap; height: auto; padding: 0.6rem 1rem; }
  .cue { grid-template-columns: 3rem minmax(0, 1fr); }
  .cue-orig { font-size: 1.12rem; }
}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Разбор</div>
    <form class="url-form" id="urlForm">
      <input id="urlInput" type="text" placeholder="Ссылка на YouTube" aria-label="Ссылка на видео YouTube">
      <button class="btn" type="submit">Открыть</button>
    </form>
    <button class="btn-ghost" id="themeBtn" type="button">Тема</button>
  </header>

  <main class="main">
    <div class="stage">
      <div class="player-box"><div id="player"></div></div>
    </div>

    <div class="controls">
      <button class="btn-ghost" id="replayBtn" type="button" title="Переслушать текущую фразу">Переслушать фразу</button>
      <button class="btn-ghost" id="loopBtn" type="button" aria-pressed="false">Зациклить</button>
      <button class="btn-ghost" id="slowBtn" type="button" aria-pressed="false">0.75×</button>
      <button class="btn-ghost" id="trBtn" type="button" aria-pressed="true">Русский</button>
      <select class="btn-ghost" id="lvlSel" title="Переводить только реплики этого уровня и сложнее">
        <option value="">Все уровни</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C">B2+</option>
      </select>
      <button class="btn-ghost" id="stepBtn" type="button" aria-pressed="false" title="Пауза после каждой реплики">По фразам</button>
      <button class="btn-ghost" id="offBtn" type="button" title="Скачать видео и страницу для офлайна">Офлайн</button>
      <span class="tr-status" id="trStatus" role="status" aria-live="polite"></span>
      <div class="legend">
        <i>звучит сейчас</i>
        <i class="known">в колоде</i>

let VIDEO_ID = "arj7oStGLkU";

/* Офлайн-пакет: build_offline.py заменяет этот null на {video: "<vid>.mp4",
   translations: {...}, levels: {...}} — страница тогда живёт без сети и без YouTube. */
const OFFLINE = /*__OFFLINE__*/null;

/* Адрес бэкенда. Он тянет субтитры произвольного видео по ссылке: в браузере это
   невозможно, потому что youtube.com/api/timedtext не отдаёт CORS-заголовки.
   Переопределяется через ?api=<адрес> — удобно, когда фронт открыт на Pages,
   а бэкенд поднят локально. */
const API = new URLSearchParams(location.search).get("api")
  || localStorage.getItem("razbor.api")
  || "http://localhost:8788";

/* ---------- Состояние ---------- */
const deck = new Map(JSON.parse(localStorage.getItem("razbor.deck") || "[]"));
let current = -1, selected = null, player = null, ready = false;
let loopCue = null, slow = false, userScrolling = 0;
// «Доиграть до секунды и встать» — для диктанта: реплика должна играть ровно
// одна, иначе плеер уезжает дальше и следующая фраза подсказывает ответ на слух.
let playUntil = 0;
let stepMode = localStorage.getItem("razbor.step") === "on", stepStopped = -1;

const save = () => localStorage.setItem("razbor.deck", JSON.stringify([...deck]));
const norm = w => w.toLowerCase().replace(/^[^\p{L}'-]+|[^\p{L}'-]+$/gu, "");
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.dataset.show = "true";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.dataset.show = "false"), 1800);
}

/* ---------- Отрисовка расшифровки ----------
   Каждое слово — отдельный span: он и цель клика, и цель караоке-подсветки.
   Слово из колоды получает нижнее подчёркивание — так виден твой словарь. */
function renderTranscript() {
  const box = document.getElementById("transcript");
  box.innerHTML = "";
  CUES.forEach((cue, ci) => {
    const el = document.createElement("div");
    el.className = "cue";
    el.dataset.i = ci;

    const time = document.createElement("button");
    time.className = "cue-time";
    time.type = "button";
    time.textContent = fmt(cue.start);
    time.title = "Перейти к этому моменту";
    time.onclick = () => seek(cue.start);

    const body = document.createElement("div");
    body.className = "cue-body";
    const orig = document.createElement("div");
    orig.className = "cue-orig";

    cue.words.forEach((wd, wi) => {
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = wd.w;
      s.dataset.ci = ci;
      s.dataset.wi = wi;
      if (deck.has(norm(wd.w))) s.classList.add("known");
      // Shift+клик растягивает разбор до словосочетания от уже выбранного слова —
      // быстрый путь для десктопа; на телефоне то же делается кликами в контексте.
      s.onclick = e => {
        if (e.shiftKey && selected && selected.ci === ci) {
          getSelection().removeAllRanges(); // иначе браузер выделит текст между кликами
          const a = selected.anchor ?? selected.wi;
          lookup(ci, Math.min(a, wi), Math.abs(wi - a) + 1, a);
        } else lookup(ci, wi);
      };
      orig.appendChild(s);
      orig.appendChild(document.createTextNode(" "));
    });

    const tr = document.createElement("div");
    tr.className = "cue-tr";
    tr.textContent = translateCue(cue, ci);

    body.append(orig, tr);
    el.append(time, body);
    box.appendChild(el);
  });
  paintKnownPhrases();
}

/* Сохранённые словосочетания подчёркиваются так же, как слова, но по одному
   span'у их не поймать — ищем последовательность слов карточки в каждой реплике. */
function paintKnownPhrases() {
  const phrases = [...deck.keys()].filter(k => k.includes(" ")).map(k => k.split(" "));
  if (!phrases.length) return;
  document.querySelectorAll(".cue").forEach(el => {
    const spans = el.querySelectorAll(".w");
    const keys = [...spans].map(s => norm(s.textContent));
    for (const ph of phrases)
      for (let i = 0; i + ph.length <= keys.length; i++)
        if (ph.every((w, j) => keys[i + j] === w))
          for (let j = 0; j < ph.length; j++) spans[i + j].classList.add("known");
  });
}

/* ---------- Вторая дорожка ----------
   Перевод делает Claude на бэкенде, пачками по 40 строк с оглядкой на соседние.
   Склейка по словам («они затем что они») давала нечитаемый мусор и убрана:
   субтитры рвут предложение посередине, переводить их можно только целиком.

   Ответ приходит потоком (NDJSON), а не одним куском: у двухчасового подкаста
   пачек полсотни, и ждать последнюю — значит минуту смотреть в пустой экран.
   Каждая доехавшая пачка сразу проставляется в уже отрисованные строки. */
let TRANSLATIONS = {};
let trOn = localStorage.getItem("razbor.tr") !== "off";
let trAbort = null;

function translateCue(cue, i) {
  return TRANSLATIONS[i] || "";
}

function applyTrMode() {
  document.getElementById("transcript").dataset.tr =
    !trOn ? "off" : trAbort ? "loading" : "idle";
  const b = document.getElementById("trBtn");
  b.setAttribute("aria-pressed", String(trOn));
  b.textContent = trOn ? "Русский" : "Только English";
}

function trStatus(text) {
  document.getElementById("trStatus").textContent = text;
}

/* Проставляем перевод в уже нарисованные строки — без перерисовки всей расшифровки,
   иначе на каждой пачке сбрасывалась бы караоке-подсветка и позиция скролла. */
function paintTranslations(lines) {
  for (const [i, text] of Object.entries(lines)) {
    TRANSLATIONS[i] = text;
    const el = document.querySelector(`.cue[data-i="${i}"] .cue-tr`);
    if (el) el.textContent = text;
  }
}

/* ---------- Фильтр по уровню ----------
   Каждой реплике Claude ставит оценку сложности: A (базовая), B1, B2, C (идиомы,
   редкая лексика). Выбранный уровень оставляет перевод только там, где реплика
   НА или ВЫШЕ него: простое читается по-английски, сложное подстраховано. */
let LEVELS = {};
let userLevel = localStorage.getItem("razbor.level") || "";
let lvlAbort = null;

const LVL_RANK = { A: 0, B1: 1, B2: 2, C: 3 };

function applyLevelFilter() {
  const min = LVL_RANK[userLevel];
  document.querySelectorAll(".cue").forEach(el => {
    const g = LEVELS[el.dataset.i];
    // Пока оценки нет — перевод показываем: лучше лишний перевод, чем скрытый нужный
    el.classList.toggle("lvl-skip", min !== undefined && g !== undefined && LVL_RANK[g] < min);
  });
}

async function loadLevels(videoId, texts) {
  LEVELS = {};
  lvlAbort?.abort();
  const ac = (lvlAbort = new AbortController());
  try {
    const cached = await fetch(`${API}/api/levels/${videoId}`, { signal: ac.signal })
      .then(r => (r.ok ? r.json() : { lines: {} }))
      .catch(() => ({ lines: {} }));
    if (ac.signal.aborted) return;
    Object.assign(LEVELS, cached.lines || {});
    applyLevelFilter();
    if (Object.keys(LEVELS).length >= texts.length) return;

    const res = await fetch(`${API}/api/level-video`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ videoId, texts }),
      signal: ac.signal,
    });
    if (!res.ok) return;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n");
      buf = parts.pop();
      for (const line of parts) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line);
        if (msg.lines) { Object.assign(LEVELS, msg.lines); applyLevelFilter(); }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") console.warn("уровни:", err.message);
  } finally {
    if (lvlAbort === ac) lvlAbort = null;
  }
}

/**
 * Тянет перевод для видео: сперва готовый из кэша, недостающее — переводит на лету.
 * Прерываемо: при смене видео старый поток отменяется, иначе перевод предыдущего
 * доедет и заляжет поверх нового.
 */
async function loadTranslations(videoId, texts) {
  TRANSLATIONS = {};
  trAbort?.abort();
  const ac = (trAbort = new AbortController());

  try {
    const cached = await fetch(`${API}/api/translation/${videoId}`, { signal: ac.signal })
      .then(r => (r.ok ? r.json() : { lines: {} }))
      .catch(() => ({ lines: {} }));
    if (ac.signal.aborted) return;
    paintTranslations(cached.lines || {});

    if (Object.keys(TRANSLATIONS).length >= texts.length) {
      trStatus(""); applyTrMode(); return;
    }

    applyTrMode();
    trStatus(`Перевожу… 0 / ${texts.length}`);
    const res = await fetch(`${API}/api/translate-video`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ videoId, texts }),
      signal: ac.signal,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Ошибка ${res.status}`);

    // NDJSON: один объект на строку. Хвост без \n держим в буфере до следующего чтения.
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n");
      buf = parts.pop();
      for (const line of parts) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line);
        if (msg.lines) paintTranslations(msg.lines);
        if (msg.error) toast(`Пачка не перевелась: ${msg.error}`);
        // done === true только в финальном сообщении; в промежуточных это число
        // переведённых строк — перепутать их значит потерять счётчик прогресса.
        if (msg.done === true) trStatus("");
        else if (msg.total) trStatus(`Перевожу… ${msg.done} / ${msg.total}`);
      }
    }
    trStatus("");
  } catch (err) {
    if (err.name === "AbortError") return;
    trStatus("перевод недоступен");
    toast(`Перевод не запустился: ${err.message}`);
  } finally {
    if (trAbort === ac) trAbort = null;
    applyTrMode();
  }
}

/* ---------- Адаптер плеера ----------
   Один интерфейс на два плеера: YouTube-iframe онлайн и локальный <video>
   в офлайн-пакете. Всё управление ходит только через P — прямых вызовов
   player.* в остальном коде нет. */
let videoEl = null;
const P = {
  local: !!OFFLINE,
  time:    () => P.local ? (videoEl?.currentTime || 0) : (ready ? player.getCurrentTime() : 0),
  playing: () => P.local ? !!(videoEl && !videoEl.paused && !videoEl.ended)
                         : (ready && player.getPlayerState && player.getPlayerState() === 1),
  seek:    t  => { if (P.local) { if (videoEl) { videoEl.currentTime = t; videoEl.play(); } }
                   else if (ready) { player.seekTo(t, true); player.playVideo(); } },
  toggle:  () => { if (P.local) { if (videoEl) videoEl.paused ? videoEl.play() : videoEl.pause(); }
                   else if (ready) { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); } },
  pause:   () => { if (P.local) videoEl?.pause(); else if (ready) player.pauseVideo(); },
  play:    () => { if (P.local) videoEl?.play(); else if (ready) player.playVideo(); },
  rate:    r  => { if (P.local) { if (videoEl) videoEl.playbackRate = r; }
                   else if (ready) player.setPlaybackRate(r); },
  load:    v  => { if (!P.local && ready) player.loadVideoById(v); },
};

/* ---------- Караоке-подсветка ----------
   У IFrame API нет события timeupdate, поэтому опрашиваем getCurrentTime()
   в rAF и интерполируем между тиками, иначе подсветка дёргается.
   Для локального <video> тот же цикл — currentTime у него точный сам по себе. */
let lastT = 0, lastStamp = 0;
function tick() {
  requestAnimationFrame(tick);
  if (!P.local && (!ready || !player.getCurrentTime)) return;

  const raw = P.time();
  if (raw !== lastT) { lastT = raw; lastStamp = performance.now(); }
  const playing = P.playing();
  const t = playing && !P.local ? raw + (performance.now() - lastStamp) / 1000 : raw;

  document.getElementById("tc").textContent = fmt(t);

  if (loopCue && t > loopCue.end) { seek(loopCue.start); return; }

  if (playUntil && t >= playUntil) { playUntil = 0; P.pause(); }

  /* Режим «по фразам»: пауза на конце каждой реплики. Слушаешь → успеваешь понять →
     пробел → дальше. Без паузы речь идёт сплошным потоком, и разбирать её некогда:
     ухо ещё держит предыдущую фразу, а говорят уже следующую. */
  if (stepMode && playing) {
    const c = CUES[current];
    if (c && t >= c.end - 0.05 && stepStopped !== current) {
      stepStopped = current;
      P.pause();
    }
  }

  const ci = findCue(t);
  if (ci !== current) {
    const prev = document.querySelector(".cue.active");
    if (prev) {
      prev.classList.remove("active");
      // Снимаем подсветку со старой реплики, иначе слово в ней остаётся «звучащим»
      prev.querySelectorAll(".w.now, .w.spoken")
          .forEach(s => s.classList.remove("now", "spoken"));
    }
    if (ci >= 0) {
      const el = document.querySelector(`.cue[data-i="${ci}"]`);
      el?.classList.add("active");
      if (el && Date.now() - userScrolling > 2500) {
        el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
    current = ci;
  }
  if (ci >= 0) paintWords(ci, t);
}

function findCue(t) {
  let lo = 0, hi = CUES.length - 1, res = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (CUES[mid].start <= t) { res = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return res >= 0 && t <= CUES[res].end + 0.35 ? res : -1;
}

function paintWords(ci, t) {
  const cue = CUES[ci];
  const spans = document.querySelectorAll(`.cue[data-i="${ci}"] .w`);
  let active = -1;
  for (let i = cue.words.length - 1; i >= 0; i--) {
    if (t >= cue.words[i].t) { active = i; break; }
  }
  spans.forEach((s, i) => {
    s.classList.toggle("now", i === active);
    s.classList.toggle("spoken", i < active);
  });
}

/* ---------- Разбор слова ----------
   Слово переводит Claude с оглядкой на фразу, а не словарь: «plow through life» —
   это не «пахать плугом», и словарной статьёй такое не берётся. Ответ кэшируем
   по паре слово+фраза, чтобы повторный клик отвечал мгновенно. */
const wordCache = new Map(JSON.parse(localStorage.getItem("razbor.words") || "[]"));
const saveWords = () =>
  localStorage.setItem("razbor.words", JSON.stringify([...wordCache].slice(-500)));

const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

/* Разбор может держать не одно слово, а словосочетание: len слов начиная с wi.
   Фразовые глаголы и идиомы («plow through», «get away with») — главное, что
   стоит учить по видео, и по одному слову их не взять: «plow» отдельно и
   «through» отдельно не складываются в смысл. anchor — опорное слово, от
   которого выбор растягивается кликами по соседним словам контекста. */
function lookup(ci, wi, len = 1, anchor = wi) {
  const cue = CUES[ci];
  const picked = cue.words.slice(wi, wi + len).map(x => x.w);
  const word = picked.join(" ");
  const key = picked.map(norm).filter(Boolean).join(" ");
  selected = { key, word, ci, wi, len, anchor, cue };
  switchTab("lookup");

  const ctx = cue.words.map((w, i) =>
    `<span class="ctx-w${i >= wi && i < wi + len ? " sel" : ""}" data-i="${i}">${esc(w.w)}</span>`
  ).join(" ");
  const cacheKey = `${key}|${cue.text}`;
  const hit = wordCache.get(cacheKey);

  document.getElementById("panelLookup").innerHTML = `
    <div class="lookup-head"><span class="lookup-word">${esc(word)}</span></div>
    <div class="lookup-tr" id="lookupTr">${hit ? esc(hit.tr) : "перевожу…"}</div>
    <div class="lookup-note" id="lookupNote">${hit?.note ? esc(hit.note) : ""}</div>
    <div class="context">
      <span class="context-label">Как это звучит в видео · ${fmt(cue.start)}</span>
      <div class="context-text" id="ctxText">${ctx}</div>
      <span class="ctx-hint">${len > 1
        ? "Клик по опорному слову — вернуться к одному слову."
        : "Нажми соседнее слово, чтобы разобрать словосочетание целиком."}</span>
    </div>
    <div class="lookup-actions">
      <button class="btn" id="saveBtn" type="button">${deck.has(key) ? "В колоде" : "Сохранить"}</button>
      <button class="btn-ghost" id="ctxPlay" type="button">Переслушать</button>
    </div>`;

  // Клик по слову контекста растягивает выбор от опорного слова до нажатого.
  document.querySelectorAll("#ctxText .ctx-w").forEach(s => {
    s.onclick = () => {
      const j = +s.dataset.i;
      if (j === anchor && len > 1) lookup(ci, anchor, 1);
      else lookup(ci, Math.min(anchor, j), Math.abs(j - anchor) + 1, anchor);
    };
  });

  document.getElementById("ctxPlay").onclick = () => replay(cue);
  // Сохранить можно и до ответа переводчика: карточка доберёт перевод, когда он придёт.
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.onclick = () => addCard(key, word, wordCache.get(cacheKey)?.tr || "", cue, wi, len);
  if (hit) return;
  // В офлайн-пакете сети нет — честно говорим сразу, а не после таймаута запроса
  if (OFFLINE) {
    const el = document.getElementById("lookupTr");
    el.textContent = "перевод слова доступен только онлайн";
    el.classList.add("lookup-miss");
    return;
  }

  fetch(`${API}/api/word`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ word, context: cue.text }),
  })
    .then(r => r.json())
    .then(res => {
      if (res.error || !res.tr) throw new Error(res.error || "пустой ответ");
      wordCache.set(cacheKey, { tr: res.tr, note: res.note });
      saveWords();
      // Панель могли уже переключить на другое слово — не затираем чужой разбор.
      if (selected?.key !== key || selected?.ci !== ci) return;
      document.getElementById("lookupTr").textContent = res.tr;
      document.getElementById("lookupNote").textContent = res.note || "";
      // Карточку, сохранённую до ответа, дозаполняем задним числом.
      const card = deck.get(key);
      if (card && !card.tr) { card.tr = res.tr; save(); renderDeck(); }
    })
    .catch(err => {
      if (selected?.key !== key || selected?.ci !== ci) return;
      const el = document.getElementById("lookupTr");
      if (el) { el.textContent = "переводчик недоступен"; el.classList.add("lookup-miss"); }
    });
}

function addCard(key, word, tr, cue, wi, len = 1) {
  if (deck.has(key)) { toast("Уже в колоде"); return; }
  deck.set(key, {
    word, tr: tr || "",
    ctx: cue.words.map(w => w.w).join(" "),
    // len — сколько слов занимает словосочетание; у старых карточек поля нет,
    // читать всюду как (c.len || 1).
    wi, len, at: cue.start, due: Date.now(), ease: 2.5, ivl: 0, reps: 0,
    // Для видеофрагмента фразы: из какого видео и до какой секунды она звучит.
    vid: VIDEO_ID, end: cue.end,
  });
  // Кусок видео с фразой вырезается сразу при сохранении (~9 с на сервере):
  // к повторению он уже лежит на диске и играет мгновенно, без загрузки подкаста.
  fetch(`${API}/api/clip`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ videoId: VIDEO_ID, start: cue.start, end: cue.end }),
  }).catch(() => { /* не вырезался — карточка сработает через перемотку плеера */ });
  save();
  logStat("added");
  // Подчеркнуть новые вхождения: слово ловится по одному span'у, словосочетание —
  // поиском последовательности слов по репликам.
  if (key.includes(" ")) paintKnownPhrases();
  else document.querySelectorAll(".w").forEach(s => {
    if (norm(s.textContent) === key) s.classList.add("known");
  });
  document.getElementById("saveBtn").textContent = "В колоде";
  renderDeck();
  toast(`«${word}» сохранено с контекстом`);
}

/* ---------- Переслушать и петля ----------
   Вместо вырезания аудио (запрещено правилами YouTube) — перемотка внутри плеера. */
// Любая ручная перемотка снимает «доиграть до»: пользователь сам решил, куда слушать.
function seek(t) { playUntil = 0; P.seek(t); }
function replay(cue) { seek(cue.start); toast("Фраза с начала"); }

/* ---------- Статистика ----------
   Копим по дням: сколько слов добавлено, сколько повторов, сколько минут просмотра.
   Хранится 90 дней — этого хватает на графики и не раздувает localStorage. */
const stats = JSON.parse(localStorage.getItem("razbor.stats") || "{}");
const today = () => new Date().toISOString().slice(0, 10);

function logStat(kind, n = 1) {
  const d = today();
  const day = (stats[d] ||= { added: 0, review: 0, again: 0, sec: 0 });
  day[kind] = (day[kind] || 0) + n;
  // Держим окно в 90 дней, иначе за год накопится мусор
  const keys = Object.keys(stats).sort();
  while (keys.length > 90) delete stats[keys.shift()];
  localStorage.setItem("razbor.stats", JSON.stringify(stats));
}

/* Минуты просмотра: тикаем раз в 15 секунд, пока видео реально играет. */
setInterval(() => { if (P.playing()) logStat("sec", 15); }, 15000);

function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    out.push({ d, ...(stats[d] || { added: 0, review: 0, again: 0, sec: 0 }) });
  }
  return out;
}

/* ---------- Колода ---------- */
function renderDeck() {
  const box = document.getElementById("panelDeck");
  if (!deck.size) {
    box.innerHTML = `<div class="empty">
      <div class="empty-title">Колода пуста</div>
      <p>Нажми любое слово в расшифровке, чтобы посмотреть перевод и сохранить его вместе с фразой из видео.</p></div>
      <div id="libBox"></div>`;
    renderLibrary();
    return;
  }
  const due = [...deck.values()].filter(c => c.due <= Date.now()).length;
  const rows = [...deck.entries()].map(([k, c]) => `
    <div class="card-row">
      <span class="card-w">${c.word}</span>
      <span class="card-tr">${c.tr || "—"}</span>
      <button class="card-jump" type="button" data-at="${c.at}">${fmt(c.at)}</button>
    </div>`).join("");

  box.innerHTML = `
    <div class="deck-stats">
      <div class="stat"><b>${deck.size}</b><span>всего</span></div>
      <div class="stat"><b>${due}</b><span>к повтору</span></div>
      <div class="stat"><b>${coverage()}%</b><span>понятно</span></div>
    </div>
    <div class="lookup-actions">
      <button class="btn-ghost" id="ankiBtn" type="button">В Anki</button>
    </div>${rows}
    <div id="libBox"></div>`;

  box.querySelectorAll(".card-jump").forEach(b => {
    b.onclick = () => seek(parseFloat(b.dataset.at));
  });
  // Покрытие пересчитываем при показе колоды: оно растёт по мере сохранения слов
  if (library[VIDEO_ID]) noteVideo(VIDEO_ID, null, { cov: coverage() });
  renderLibrary();

  // Экспорт в Anki: карточки уезжают с теми же видеофрагментами, что и здесь
  document.getElementById("ankiBtn").onclick = async e => {
    const btn = e.currentTarget;
    if (OFFLINE) { toast("Экспорт доступен только онлайн"); return; }
    btn.textContent = "Собираю…";
    btn.disabled = true;
    try {
      const res = await fetch(`${API}/api/anki`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify([...deck.entries()]),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "не собралось");
      // Скачиваем сразу: пользователю нужен файл, а не ссылка на него
      const a = document.createElement("a");
      a.href = `${API}${data.url}`;
      a.download = "razbor.apkg";
      a.click();
      toast(data.info || "Колода собрана");
    } catch (err) {
      toast(`Anki: ${err.message}`);
    } finally {
      btn.textContent = "В Anki";
      btn.disabled = false;
    }
  };
}

/* ---------- Библиотека видео ----------
   История открытого с прогрессом и покрытием: зная, сколько слов видео уже
   в колоде, видно, какое смотреть следующим — это и есть подбор по i+1. */
const library = JSON.parse(localStorage.getItem("razbor.library") || "{}");

function noteVideo(vid, title, extra = {}) {
  library[vid] = {
    ...library[vid],
    title: title || library[vid]?.title || vid,
    // Число реплик берём только у открытого сейчас видео: для любого другого
    // CUES относится к чужому видео и записал бы ему чужую длину.
    ...(vid === VIDEO_ID ? { cues: CUES.length } : {}),
    seen: Date.now(),
    ...extra,
  };
  localStorage.setItem("razbor.library", JSON.stringify(library));
}

function renderLibrary() {
  const box = document.getElementById("libBox");
  if (!box) return;
  const items = Object.entries(library).sort((a, b) => b[1].seen - a[1].seen).slice(0, 12);
  if (!items.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="chart-title">Недавние видео</div>` + items.map(([vid, v]) => `
    <div class="lib-row">
      <button class="lib-open" type="button" data-vid="${vid}">${esc(v.title).slice(0, 52)}</button>
      <span class="lib-meta">${v.cues || "?"} реплик${v.cov != null ? ` · понятно ${v.cov}%` : ""}</span>
    </div>`).join("");
  box.querySelectorAll(".lib-open").forEach(b => {
    b.onclick = () => {
      document.getElementById("urlInput").value = `https://youtu.be/${b.dataset.vid}`;
      document.getElementById("urlForm").dispatchEvent(new Event("submit", { cancelable: true }));
    };
  });
}

/* Доля слов видео, которые уже в колоде. Это и есть основа подбора i+1:
   зная покрытие, можно искать видео нужной сложности. */
function coverage() {
  const all = CUES.flatMap(c => c.words.map(w => norm(w.w))).filter(Boolean);
  const known = all.filter(w => deck.has(w)).length;
  return all.length ? Math.round((known / all.length) * 100) : 0;
}

/* ---------- Повторение ---------- */
/* Видеофрагмент фразы в карточке. Клип обычно уже вырезан при сохранении слова;
   если нет (сервер был занят или карточка со старой сессии) — дорезаем на месте
   и показываем состояние, а не пустую дыру. */
function mountClip(c, box) {
  // Офлайн клипы с сервера недоступны, но полное видео лежит рядом — играем
  // нужный отрезок из него медиафрагментом #t=начало,конец.
  if (OFFLINE) {
    box.innerHTML = "";
    const v = document.createElement("video");
    v.src = `${OFFLINE.video}#t=${Math.max(0, c.at - 0.25)},${(c.end ?? c.at + 4) + 0.35}`;
    v.controls = true; v.playsInline = true; v.preload = "metadata";
    box.appendChild(v);
    return;
  }
  const url = `${API}/api/clip`;
  const put = src => {
    box.innerHTML = "";
    const v = document.createElement("video");
    v.src = src;
    v.controls = true;
    v.playsInline = true;
    v.preload = "auto";
    box.appendChild(v);
  };
  fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ videoId: c.vid, start: c.at, end: c.end }),
  })
    .then(r => r.json())
    .then(res => {
      if (!res.url) throw new Error(res.error || "клип не вырезался");
      put(`${API}${res.url}`);
    })
    .catch(() => {
      box.innerHTML = `<div class="clip-miss">Кусок видео не вырезался — можно переслушать в плеере.</div>`;
    });
  box.innerHTML = `<div class="clip-miss">Вырезаю кусок видео…</div>`;
}

let reviewKey = null, revealed = false;
let clozeMode = localStorage.getItem("razbor.cloze") !== "off";
function renderReview() {
  const box = document.getElementById("panelReview");
  const dueCards = [...deck.entries()].filter(([, c]) => c.due <= Date.now());
  if (!dueCards.length) {
    box.innerHTML = `<div class="empty">
      <div class="empty-title">${deck.size ? "На сегодня всё" : "Пока нечего повторять"}</div>
      <p>${deck.size ? "Карточки вернутся, когда подойдёт срок." : "Сохрани несколько слов из расшифровки."}</p></div>`;
    return;
  }
  const [key, c] = dueCards[0];
  reviewKey = key;
  // Карточка может держать словосочетание: len слов начиная с wi (у старых len нет).
  const inSel = i => i >= c.wi && i < c.wi + (c.len || 1);
  const ctx = c.ctx.split(" ").map((w, i) => (inSel(i) ? `<b>${esc(w)}</b>` : esc(w))).join(" ");

  // Фраза в карточке — вырезанный кусок видео, не перемотка подкаста: в колоде
  // фразы из разных видео, и грузить двухчасовое ради одной реплики нельзя.
  // Старые карточки без vid откатываются на перемотку основного плеера.
  const hasClip = !!c.vid;

  // Клоз: вместо «слово → перевод» показываем фразу с пропуском на месте слова.
  // Вспоминание в контексте прочнее изолированного: слово всплывает вместе с
  // конструкцией, в которой живёт, а не как строчка словаря.
  const clozeCtx = c.ctx.split(" ")
    .map((w, i) => (inSel(i) ? `<span class="cloze">${revealed ? esc(w) : "&nbsp;".repeat(Math.max(4, w.length))}</span>` : esc(w)))
    .join(" ");

  box.innerHTML = `
    <div class="review-card">
      ${clozeMode
        ? `<div class="review-cloze">${clozeCtx}</div>
           ${revealed ? `<div class="review-word small">${esc(c.word)}</div>` : ""}`
        : `<div class="review-word">${esc(c.word)}</div>`}
      ${hasClip ? `<div class="review-clip" id="revClipBox"></div>` : ""}
      ${clozeMode ? "" : `<div class="review-ctx">${ctx}</div>`}
      ${revealed ? `<div class="review-answer">${esc(c.tr) || "перевожу…"}</div>` : ""}
      ${revealed
        ? `<div class="grade-row">
             <button class="grade" data-g="1" type="button">Забыл</button>
             <button class="grade" data-g="2" type="button">Трудно</button>
             <button class="grade" data-g="3" type="button">Норм</button>
             <button class="grade" data-g="4" type="button">Легко</button>
           </div>`
        : `<div class="grade-row" style="grid-template-columns:1fr"><button class="grade" id="revealBtn" type="button">${clozeMode ? "Показать слово" : "Показать перевод"}</button></div>`}
    </div>
    <div class="lookup-actions">
      <button class="btn-ghost" id="revPlay" type="button">${hasClip ? "Фраза ещё раз" : "Послушать в видео"}</button>
      <button class="btn-ghost" id="clozeBtn" type="button" aria-pressed="${clozeMode}">Клоз</button>
    </div>`;

  document.getElementById("clozeBtn").onclick = () => {
    clozeMode = !clozeMode;
    localStorage.setItem("razbor.cloze", clozeMode ? "on" : "off");
    renderReview();
    toast(clozeMode ? "Пропуск во фразе" : "Слово и перевод");
  };

  if (hasClip) mountClip(c, document.getElementById("revClipBox"));
  document.getElementById("revPlay").onclick = () => {
    const v = document.querySelector("#revClipBox video");
    if (v) { v.currentTime = 0; v.play(); }
    else seek(c.at);
  };
  // Карточка без перевода (сохранена до ответа переводчика или из старой версии со
  // словарём) добирает его прямо при показе — «нет перевода» больше не конечный диагноз.
  if (revealed && !c.tr) {
    fetch(`${API}/api/word`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ word: c.word, context: c.ctx }),
    })
      .then(r => r.json())
      .then(res => {
        if (!res.tr) return;
        c.tr = res.tr;
        save();
        if (reviewKey === key && revealed) {
          const el = box.querySelector(".review-answer");
          if (el) el.textContent = res.tr;
        }
        renderDeck();
      })
      .catch(() => {});
  }
  if (revealed) {
    box.querySelectorAll(".grade").forEach(b => {
      b.onclick = () => grade(key, parseInt(b.dataset.g, 10));
    });
  } else {
    document.getElementById("revealBtn").onclick = () => { revealed = true; renderReview(); };
  }
}

/* ---------- Интервальное повторение: FSRS-4.5 ----------
   Раньше здесь был упрощённый SM-2 (интервал × «лёгкость»). Заменён на FSRS,
   потому что SM-2 меряет карточку одним числом, а FSRS — двумя независимыми:

     S (stability)   — через сколько дней вспоминаемость упадёт до 90%;
     D (difficulty)  — насколько эта карточка тяжела лично тебе, 1..10.

   Разделение и даёт выигрыш: тяжёлое слово получает короткие интервалы, не
   ломая длинные у лёгких, а «Забыл» не обнуляет накопленную стабильность —
   она падает, но помнит прошлое. Веса — опубликованные дефолтные FSRS-4.5.

   Оценки: 1 Забыл, 2 Трудно, 3 Норм, 4 Легко. */
const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031,
  1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const FSRS_RETENTION = 0.9;   // целевая вероятность вспомнить в момент показа
const FSRS_DECAY = -0.5, FSRS_F = 19 / 81;

const clampD = d => Math.min(10, Math.max(1, d));
const clampS = s => Math.min(36500, Math.max(0.01, s));

/** Интервал в днях, на котором вспоминаемость упадёт до целевой. */
function fsrsInterval(S) {
  return Math.max(1, Math.round((S / FSRS_F) * (Math.pow(FSRS_RETENTION, 1 / FSRS_DECAY) - 1)));
}

/** Вспоминаемость карточки сейчас — нужна и для расчёта, и для статистики. */
function fsrsRetrievability(c, now = Date.now()) {
  if (!c.S || !c.lastRev) return 1;
  const t = Math.max(0, (now - c.lastRev) / 864e5);
  return Math.pow(1 + FSRS_F * (t / c.S), FSRS_DECAY);
}

function fsrsNext(c, g, now = Date.now()) {
  const w = FSRS_W;
  // Первое повторение: S и D берутся из начальных весов, а не пересчитываются.
  // Формула D₀ здесь ЛИНЕЙНАЯ — это FSRS-4.5. Экспоненциальный вариант из FSRS-5
  // с этими весами схлопывает D в минимум на любой оценке выше «Забыл»
  // (5.16 - e^2.46 + 1 ≈ -5.5), и сложность перестаёт что-либо значить.
  if (!c.S) {
    return {
      S: clampS(w[g - 1]),
      D: clampD(w[4] - (g - 3) * w[5]),
    };
  }
  const R = fsrsRetrievability(c, now);
  const D = clampD(
    // возврат к среднему: без него сложность дрейфует в крайности за десяток повторов.
    // Цель возврата — D₀ для оценки «Норм», то есть просто w[4].
    w[7] * w[4] + (1 - w[7]) * (c.D - w[6] * (g - 3)));

  let S;
  if (g === 1) {
    // Провал: стабильность падает, но не обнуляется — прошлые повторы не пропадают
    S = clampS(Math.min(
      w[11] * Math.pow(c.D, -w[12]) * (Math.pow(c.S + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)),
      c.S));
  } else {
    const hard = g === 2 ? w[15] : 1;
    const easy = g === 4 ? w[16] : 1;
    S = clampS(c.S * (1 + Math.exp(w[8]) * (11 - D) * Math.pow(c.S, -w[9]) *
      (Math.exp(w[10] * (1 - R)) - 1) * hard * easy));
  }
  return { S, D };
}

function grade(key, g) {
  const c = deck.get(key);
  const now = Date.now();
  const { S, D } = fsrsNext(c, g, now);
  c.S = S; c.D = D; c.lastRev = now;
  c.reps = (c.reps || 0) + 1;
  if (g === 1) c.lapses = (c.lapses || 0) + 1;

  // «Забыл» и «Трудно» возвращают карточку в ту же сессию: интервал в днях
  // на непонятом слове бессмыслен, его надо доучить сейчас.
  const ivl = g === 1 ? 0 : fsrsInterval(S);
  c.ivl = ivl;
  c.due = now + (g === 1 ? 6e5 : g === 2 && ivl <= 1 ? 18e5 : ivl * 864e5);

  deck.set(key, c); save();
  logStat(g === 1 ? "again" : "review");
  revealed = false;
  renderReview(); renderDeck();
  toast(ivl ? `Следующий показ через ${plural(ivl, "день", "дня", "дней")}` : "Вернётся через 10 минут");
}

/** 1 день / 2 дня / 5 дней — иначе «через 2 день» режет глаз. */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  const word = a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many;
  return `${n} ${word}`;
}

/* ---------- Диктант ----------
   Реплика играет, ты печатаешь на слух, показываем расхождения пословно.
   Тренирует именно аудирование: чтение субтитров его подменяет — глаз успевает
   раньше уха, и на слух текст так и не расшифровывается. */
let dictIdx = 0, dictChecked = false;

/** Сравнение по словам без учёта регистра и пунктуации: важно услышанное слово. */
function diffWords(userText, refText) {
  const clean = s => s.toLowerCase().replace(/[^\p{L}\p{N}'\s-]/gu, "").split(/\s+/).filter(Boolean);
  const a = clean(userText), b = clean(refText);

  // Расстояние редактирования по словам, чтобы пропуск слова не сдвигал всё дальше
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 0; i <= n; i++) dp[i][0] = i;
  for (let j = 0; j <= m; j++) dp[0][j] = j;
  for (let i = 1; i <= n; i++)
    for (let j = 1; j <= m; j++)
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);

  // Обратный проход: восстанавливаем, что совпало, что заменено, что пропущено
  const out = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { out.unshift({ t: "ok", w: b[j - 1] }); i--; j--; }
    else if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) { out.unshift({ t: "wrong", w: b[j - 1], got: a[i - 1] }); i--; j--; }
    else if (j > 0 && dp[i][j] === dp[i][j - 1] + 1) { out.unshift({ t: "miss", w: b[j - 1] }); j--; }
    else { out.unshift({ t: "extra", w: a[i - 1] }); i--; }
  }
  const hit = out.filter(x => x.t === "ok").length;
  return { parts: out, score: m ? Math.round((hit / m) * 100) : 0 };
}

function renderDictation() {
  const box = document.getElementById("panelDictation");
  if (!CUES.length) { box.innerHTML = `<div class="empty"><div class="empty-title">Нет реплик</div></div>`; return; }
  dictIdx = Math.min(Math.max(0, dictIdx), CUES.length - 1);
  const cue = CUES[dictIdx];

  box.innerHTML = `
    <div class="dict-head">
      <span>Реплика ${dictIdx + 1} из ${CUES.length}</span>
      <button class="btn-ghost" id="dictPlay" type="button">Слушать</button>
    </div>
    <textarea class="dict-input" id="dictInput" rows="3" placeholder="Напиши, что услышал…"
      autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="dict-result" id="dictResult"></div>
    <div class="dict-actions">
      <button class="btn" id="dictCheck" type="button">Проверить</button>
      <button class="btn-ghost" id="dictPrev" type="button">←</button>
      <button class="btn-ghost" id="dictNext" type="button">→</button>
    </div>
    <p class="dict-hint">Enter — проверить, затем → к следующей. Реплика играет из видео,
    подглядывать в расшифровку смысла нет.</p>`;

  const input = document.getElementById("dictInput");
  const result = document.getElementById("dictResult");
  dictChecked = false;

  // Играем ровно эту реплику и встаём: P.seek напрямую, потому что seek()
  // сбрасывает playUntil. Тот же запас 0.05 с, что у режима «по фразам».
  const play = () => { P.seek(cue.start); playUntil = cue.end - 0.05; };
  const check = () => {
    const { parts, score } = diffWords(input.value, cue.text);
    dictChecked = true;
    result.innerHTML = `
      <div class="dict-score" data-good="${score >= 80}">${score}% слов</div>
      <div class="dict-diff">${parts.map(p =>
        p.t === "ok" ? `<span class="d-ok">${esc(p.w)}</span>`
        : p.t === "wrong" ? `<span class="d-wrong">${esc(p.w)}</span><span class="d-got">${esc(p.got)}</span>`
        : p.t === "miss" ? `<span class="d-miss">${esc(p.w)}</span>`
        : `<span class="d-extra">${esc(p.w)}</span>`).join(" ")}</div>`;
    logStat("review");
  };

  document.getElementById("dictPlay").onclick = play;
  document.getElementById("dictCheck").onclick = check;
  document.getElementById("dictPrev").onclick = () => { dictIdx--; renderDictation(); };
  document.getElementById("dictNext").onclick = () => { dictIdx++; renderDictation(); };
  input.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      // Первый Enter проверяет, второй — уводит дальше: набирать не отрывая рук
      if (dictChecked) { dictIdx++; renderDictation(); } else check();
    }
  };
  input.focus();
  play();
}

/* ---------- Прогресс ---------- */
function renderStats() {
  const box = document.getElementById("panelStats");
  const days = lastDays(14);
  const max = Math.max(1, ...days.map(d => d.added + d.review));
  const week = lastDays(7).reduce((a, d) => ({
    added: a.added + d.added, review: a.review + d.review, sec: a.sec + d.sec,
  }), { added: 0, review: 0, sec: 0 });

  // Средняя вспоминаемость колоды — честный ответ на «сколько я реально помню»
  const cards = [...deck.values()];
  const recall = cards.length
    ? Math.round(cards.reduce((s, c) => s + fsrsRetrievability(c), 0) / cards.length * 100) : 0;
  const mature = cards.filter(c => (c.ivl || 0) >= 21).length;

  box.innerHTML = `
    <div class="deck-stats">
      <div class="stat"><b>${week.added}</b><span>слов за неделю</span></div>
      <div class="stat"><b>${week.review}</b><span>повторов</span></div>
      <div class="stat"><b>${Math.round(week.sec / 60)}</b><span>минут видео</span></div>
    </div>
    <div class="deck-stats">
      <div class="stat"><b>${recall}%</b><span>помню сейчас</span></div>
      <div class="stat"><b>${mature}</b><span>выучено прочно</span></div>
      <div class="stat"><b>${coverage()}%</b><span>понятно в видео</span></div>
    </div>
    <div class="chart-title">Активность за 14 дней</div>
    <div class="chart">${days.map(d => {
      const h = Math.round(((d.added + d.review) / max) * 100);
      const label = new Date(d.d).toLocaleDateString("ru", { day: "numeric", month: "short" });
      return `<div class="bar-col" title="${label}: +${d.added} слов, ${d.review} повторов">
        <div class="bar" style="height:${Math.max(2, h)}%"></div>
        <span>${d.d.slice(8)}</span></div>`;
    }).join("")}</div>
    <p class="dict-hint">«Помню сейчас» — средняя вспоминаемость колоды по FSRS.
    «Выучено прочно» — карточки с интервалом от трёх недель.</p>`;
}

/* ---------- Вкладки ---------- */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  document.querySelectorAll(".panel").forEach(p =>
    p.dataset.open = String(p.dataset.panel === name));
  if (name === "deck") renderDeck();
  if (name === "review") { revealed = false; renderReview(); }
  if (name === "dictation") renderDictation();
  if (name === "stats") renderStats();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchTab(t.dataset.tab));

/* ---------- Плеер ---------- */
function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    videoId: VIDEO_ID,
    // cc_load_policy: 0 — гасим родные субтитры YouTube: свои две дорожки
    // мы рисуем ПОД плеером (оверлей поверх плеера запрещён правилами).
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0 },
    events: {
      onReady: () => { ready = true; tick(); },
      onError: e => toast(`Плеер: ошибка ${e.data}. Видео недоступно для встраивания.`),
    },
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

/* Локальный плеер офлайн-пакета: обычный <video>, файл лежит рядом со страницей. */
function mountLocalPlayer() {
  const box = document.querySelector(".player-box");
  box.innerHTML = "";
  videoEl = document.createElement("video");
  videoEl.src = OFFLINE.video;
  videoEl.controls = true;
  videoEl.playsInline = true;
  videoEl.preload = "metadata";
  videoEl.style.cssText = "position:absolute;inset:0;width:100%;height:100%;background:#000";
  box.appendChild(videoEl);
  tick();
}

/* ---------- Управление ---------- */
document.getElementById("replayBtn").onclick = () => {
  const c = CUES[current >= 0 ? current : 0];
  if (c) replay(c);
};
document.getElementById("loopBtn").onclick = e => {
  const on = loopCue === null;
  loopCue = on ? CUES[current >= 0 ? current : 0] : null;
  e.currentTarget.setAttribute("aria-pressed", String(on));
  toast(on ? "Фраза зациклена" : "Петля снята");
};
document.getElementById("slowBtn").onclick = e => {
  slow = !slow;
  P.rate(slow ? 0.75 : 1);
  e.currentTarget.setAttribute("aria-pressed", String(slow));
};
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.dataset.theme = next;
  else delete document.documentElement.dataset.theme;
  toast(next === "dark" ? "Тёмная тема" : next === "light" ? "Светлая тема" : "Как в системе");
};
/* Вставил ссылку — получил расшифровку. Ни входа в аккаунт, ни расширения. */
document.getElementById("urlForm").onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById("urlInput");
  const btn = e.target.querySelector("button");
  const v = input.value.trim();
  const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/) || v.match(/^([\w-]{11})$/);
  if (!m) { toast("Не похоже на ссылку YouTube"); return; }

  const label = btn.textContent;
  btn.textContent = "Гружу…";
  btn.disabled = true;
  showTranscriptState("Ищу дорожку субтитров…");

  try {
    // Шаг 1: у сервера просим только подписанную ссылку — это один дешёвый запрос.
    // Таймаут обязателен: страница по https не может достучаться до http://localhost
    // (браузер блокирует обращения публичных сайтов к локальной сети), и без него
    // запрос просто виснет вместо внятной ошибки.
    const ac = new AbortController();
    const killer = setTimeout(() => ac.abort(), 12000);
    const res = await fetch(`${API}/api/track`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ url: v, lang: "en" }),
      signal: ac.signal,
    }).finally(() => clearTimeout(killer));
    const info = await res.json();
    if (!res.ok) throw new Error(info.error || "Не удалось найти субтитры");

    // Шаг 2: качаем сами, со своего адреса. Ссылка отдаёт CORS-заголовки
    // и не привязана к IP, поэтому браузеру это доступно напрямую.
    showTranscriptState(`Качаю дорожку «${info.picked.name}»…`);
    const subRes = await fetch(info.picked.url);
    if (!subRes.ok) throw new Error(`Дорожка не отдалась (${subRes.status})`);
    const raw = await subRes.json();

    CUES = normalizeJson3(raw);
    if (!CUES.length) throw new Error("Дорожка пустая");
    VIDEO_ID = info.videoId;
    current = -1;
    loopCue = null;
    // Сбрасываем ДО отрисовки: renderTranscript берёт перевод по номеру строки, и перевод
    // прошлого видео молча лёг бы на новые реплики — ровно это и случилось на первом тесте.
    trAbort?.abort();
    trAbort = null;
    TRANSLATIONS = {};
    lvlAbort?.abort();
    lvlAbort = null;
    LEVELS = {};
    trStatus("");
    applyTrMode();
    document.getElementById("offBtn").textContent = "Офлайн";
    renderTranscript();
    renderDeck();
    P.load(VIDEO_ID);
    noteVideo(VIDEO_ID, info.title, { cov: coverage() });
    toast(`Загружено реплик: ${CUES.length}${info.fromCache ? " (из кэша)" : ""}`);
    // Перевод и уровни не ждём: строки уже на экране, остальное дотекает поверх.
    loadTranslations(VIDEO_ID, CUES.map(c => c.text));
    loadLevels(VIDEO_ID, CUES.map(c => c.text));
    // Реплики — на сервер: клиент качал их сам, а офлайн-пакету они нужны на диске
    fetch(`${API}/api/cues-store`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ videoId: VIDEO_ID, cues: CUES }),
    }).catch(() => {});
  } catch (err) {
    const unreachable = /Failed to fetch|NetworkError|aborted/i.test(err.message) || err.name === "AbortError";
    const httpsToLocal = location.protocol === "https:" && /^http:\/\/(localhost|127\.)/.test(API);
    const msg = !unreachable ? err.message
      : httpsToLocal
        ? `Эта страница открыта по https и не может обращаться к бэкенду на localhost — так устроена защита браузера. Открой приложение локально: http://localhost:8777`
        : `Бэкенд недоступен по адресу ${API}. Запусти его: cd server && npm start`;
    showTranscriptState(msg);
    toast(unreachable ? "Бэкенд недоступен" : err.message);
  } finally {
    btn.textContent = label;
    btn.disabled = false;
  }
};

/* Состояние загрузки и ошибок вместо пустого экрана. */
function showTranscriptState(text) {
  document.getElementById("transcript").innerHTML =
    `<div class="empty"><div class="empty-title">${text}</div></div>`;
}

/* json3 → чистые реплики. Тот же алгоритм, что на сервере: ASR присылает
   «бегущую строку» нарастающими кусками, без схлопывания текст задваивается.
   Пословный тайминг = tStartMs реплики + tOffsetMs сегмента. */
function normalizeJson3(raw) {
  const cues = [];
  for (const ev of raw.events || []) {
    const segs = ev.segs;
    if (!segs?.length) continue;
    const text = segs.map(s => s.utf8 || "").join("").replace(/\s+/g, " ").trim();
    if (!text) continue;

    const start = (ev.tStartMs ?? 0) / 1000;
    const dur = (ev.dDurationMs ?? 0) / 1000;
    const hasWordTiming = segs.some(s => s.tOffsetMs != null);

    let words = segs
      .map(s => ({ w: (s.utf8 || "").trim(), off: s.tOffsetMs ?? 0 }))
      .filter(s => s.w)
      .map(s => ({ w: s.w, t: start + s.off / 1000 }));

    // Ручные субтитры пословного тайминга не несут — раскладываем по длине слов
    if (!hasWordTiming && words.length > 1 && dur > 0) {
      const total = words.reduce((n, x) => n + x.w.length, 0);
      let acc = 0;
      words = words.map(x => {
        const t = start + (acc / total) * dur;
        acc += x.w.length;
        return { w: x.w, t };
      });
    }
    if (words.length) cues.push({ start, end: start + dur, text, words });
  }

  const merged = [];
  for (const c of cues) {
    const prev = merged[merged.length - 1];
    if (prev && c.text.startsWith(prev.text) && c.start - prev.start < 2.5) merged[merged.length - 1] = c;
    else merged.push(c);
  }
  for (let i = 0; i < merged.length; i++) {
    if (i + 1 < merged.length) merged[i].end = Math.min(merged[i].end, merged[i + 1].start);
    if (merged[i].end <= merged[i].start) merged[i].end = merged[i].start + 1.2;
  }
  return merged;
}
document.getElementById("transcript").addEventListener("scroll", () => { userScrolling = Date.now(); });

document.addEventListener("keydown", e => {
  // Не только INPUT: диктант набирается в TEXTAREA, и без этого пробел и стрелки
  // дёргали плеер вместо ввода текста; SELECT — селектор уровня, там стрелки свои.
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.code === "Space") {
    e.preventDefault();
    // В режиме «по фразам» пробел на паузе ведёт к следующей реплике, а не просто
    // снимает паузу: иначе плеер тут же упрётся в тот же конец фразы и встанет.
    if (stepMode && !P.playing() && stepStopped >= 0 && stepStopped < CUES.length - 1) {
      stepStopped = -1;
      seek(CUES[current + 1]?.start ?? P.time());
    } else P.toggle();
  }
  if (e.key === "ArrowLeft" && current > 0) seek(CUES[current - 1].start);
  if (e.key === "ArrowRight" && current < CUES.length - 1) seek(CUES[current + 1].start);
  if (e.key.toLowerCase() === "r") { const c = CUES[current]; c && replay(c); }
});

/* ---------- Старт ---------- */
document.getElementById("trBtn").onclick = () => {
  trOn = !trOn;
  localStorage.setItem("razbor.tr", trOn ? "on" : "off");
  applyTrMode();
  toast(trOn ? "Перевод включён" : "Только английские субтитры");
  // Выключили до конца перевода — доводить нечего, но и обрывать поток не надо:
  // он допишется в кэш, и при следующем включении перевод будет уже готов.
  if (trOn && !trAbort && Object.keys(TRANSLATIONS).length < CUES.length) {
    loadTranslations(VIDEO_ID, CUES.map(c => c.text));
  }
};

/* Режим «по фразам»: пауза на конце реплики, пробел — дальше. */
document.getElementById("stepBtn").onclick = e => {
  stepMode = !stepMode;
  stepStopped = -1;
  localStorage.setItem("razbor.step", stepMode ? "on" : "off");
  e.currentTarget.setAttribute("aria-pressed", String(stepMode));
  toast(stepMode ? "Пауза после каждой фразы — пробел дальше" : "Обычное воспроизведение");
};

/* Уровень: селектор в панели, выбор переживает перезагрузку. */
const lvlSel = document.getElementById("lvlSel");
lvlSel.value = userLevel;
lvlSel.onchange = () => {
  userLevel = lvlSel.value;
  localStorage.setItem("razbor.level", userLevel);
  applyLevelFilter();
  toast(userLevel ? `Перевод только для ${lvlSel.options[lvlSel.selectedIndex].text} и сложнее` : "Перевод для всех реплик");
};

/* Офлайн: сервер качает видео и собирает автономную страницу, мы опрашиваем статус.
   Готовый пакет — два файла, их можно скинуть на телефон AirDrop'ом. */
document.getElementById("offBtn").onclick = async e => {
  const btn = e.currentTarget;
  if (btn.dataset.busy) return;
  btn.dataset.busy = "1";
  btn.textContent = "Готовлю…";
  try {
    const st = await fetch(`${API}/api/offline/status/${VIDEO_ID}`).then(r => r.json());
    if (st.state !== "ready") {
      await fetch(`${API}/api/offline`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ videoId: VIDEO_ID, deck: [...deck.entries()] }),
      });
      toast("Качаю видео — на длинном подкасте это минуты");
      for (;;) {
        await new Promise(r => setTimeout(r, 4000));
        const s = await fetch(`${API}/api/offline/status/${VIDEO_ID}`).then(r => r.json());
        if (s.state === "ready") break;
        if (s.state === "error") throw new Error(s.error || "не собрался");
        btn.textContent = s.state === "building" ? "Собираю…" : "Качаю…";
      }
    }
    btn.textContent = "Офлайн готов";
    toast("Пакет готов: страница + видео");
    // Ссылки на оба файла — прямо в расшифровку, чтобы было что нажать
    const box = document.createElement("div");
    box.className = "empty";
    box.innerHTML = `<div class="empty-title">Офлайн-пакет готов</div>
      <p><a href="${API}/api/offline/${VIDEO_ID}/razbor.html" download>razbor.html</a> +
      <a href="${API}/api/offline/${VIDEO_ID}/${VIDEO_ID}.mp4" download>видео .mp4</a></p>
      <p>Оба файла — в одну папку, на телефон AirDrop'ом. Открывать страницу из
      приложения с файлами (Documents и подобные) — видео лежит рядом, сеть не нужна.</p>`;
    document.getElementById("transcript").prepend(box);
  } catch (err) {
    btn.textContent = "Офлайн";
    toast(`Офлайн не собрался: ${err.message}`);
  } finally {
    delete btn.dataset.busy;
  }
};
renderTranscript();
renderDeck();
applyTrMode();
if (OFFLINE) {
  // Пакет автономен: перевод и уровни зашиты при сборке, сети нет.
  TRANSLATIONS = OFFLINE.translations || {};
  LEVELS = OFFLINE.levels || {};
  // Снимок колоды из пакета подхватываем только в пустую: на телефоне могли
  // уже наработать своё, и затирать это снимком с компьютера нельзя.
  if (!deck.size && OFFLINE.deck?.length) {
    for (const [k, c] of OFFLINE.deck) deck.set(k, c);
    save();
  }
  paintTranslations(TRANSLATIONS);
  applyLevelFilter();
  document.getElementById("trStatus").textContent = "";
  mountLocalPlayer();
} else {
  loadTranslations(VIDEO_ID, CUES.map(c => c.text));
  loadLevels(VIDEO_ID, CUES.map(c => c.text));
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
</script>
